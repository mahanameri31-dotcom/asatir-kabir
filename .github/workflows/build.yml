name: Build Asatir Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Checking project files..."
          ls -la
          echo "Checking Godot project..."
          test -f project.godot
          echo "Checking export preset..."
          test -f export_presets.cfg

      - name: Build APK
        uses: barichello/godot-ci:4.3
        with:
          args: --headless --verbose --path . --export-debug "Android" asatir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asatir-apk
          path: asatir.apk
