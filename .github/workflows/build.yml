name: Build Asatir Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f project.godot
          test -f export_presets.cfg

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.3 \
            godot --headless --verbose --path /project --export-debug "Android" /project/asatir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asatir-apk
          path: asatir.apk
