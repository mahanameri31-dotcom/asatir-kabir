name: Build Asatir Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        uses: barichello/godot-ci:4.3
        with:
          args: godot --headless --path . --export-debug "Android" asatir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asatir-apk
          path: asatir.apk
